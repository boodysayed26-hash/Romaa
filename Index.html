<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إلى رميساء - حب عمري</title>
    <style>
        body {
            font-family: Tahoma, Arial, sans-serif;
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%);
            color: #4a4a4a;
            text-align: center;
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .card {
            background: rgba(255, 255, 255, 0.95);
            max-width: 500px;
            width: 100%;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
        }
        h1 {
            color: #d63031;
            font-size: 28px;
            margin-bottom: 10px;
        }
        .heart {
            font-size: 40px;
            color: #e74c3c;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }
        .photo-frame {
            width: 160px;
            height: 160px;
            margin: 20px auto;
            border-radius: 50%;
            border: 5px solid #ff7675;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            background: linear-gradient(135deg, #ffeaa7 0%, #fab1a0 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 65px;
            animation: pulse 1.5s infinite;
        }
        p {
            font-size: 18px;
            line-height: 1.8;
            color: #2d3436;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="heart">❤️</div>
        <h1>إلى أغلى الناس.. رميساء</h1>
        
        <div class="photo-frame">
            💖
        </div>

        <p>
            كل سنة وأنتِ منورة حياتي، وربنا يخليكي ليا وما تحرمنيش أبداً من ضحكتك ولا وجودك الجميل جنبي. بحبك يا رميساء! 💕
        </p>
    </div>

</body>
</html>
